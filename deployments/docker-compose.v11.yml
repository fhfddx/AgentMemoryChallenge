x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${MASM_V11_POSTGRES_DB:-masm_v11}
      POSTGRES_USER: ${MASM_V11_POSTGRES_USER:-masm_v11}
      POSTGRES_PASSWORD: ${MASM_V11_POSTGRES_PASSWORD:?set MASM_V11_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data_v11:/var/lib/postgresql/data
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql+psycopg://${MASM_V11_POSTGRES_USER:-masm_v11}:${MASM_V11_POSTGRES_PASSWORD:?set MASM_V11_POSTGRES_PASSWORD}@postgres:5432/${MASM_V11_POSTGRES_DB:-masm_v11}
      MASM_API_KEYS: ${MASM_V11_API_KEYS:?set MASM_V11_API_KEYS}
      MASM_ASSET_DIR: /data/assets
      MASM_MAX_IMAGE_BYTES: ${MASM_MAX_IMAGE_BYTES:-10485760}
      MASM_MAX_ADD_IMAGE_BYTES: ${MASM_MAX_ADD_IMAGE_BYTES:-31457280}
      MASM_MAX_SEARCH_RESPONSE_BYTES: ${MASM_MAX_SEARCH_RESPONSE_BYTES:-31457280}
      MASM_MAX_TOP_K: 100
      MASM_MAX_CONCURRENT_REQUESTS: ${MASM_MAX_CONCURRENT_REQUESTS:-16}
      MASM_MAX_REQUESTS_PER_MINUTE: ${MASM_MAX_REQUESTS_PER_MINUTE:-1000}
      MASM_RUNTIME_PROFILE: ${MASM_V11_RUNTIME_PROFILE:-official-masm}
      MASM_LLM_BASE_URL: ${MASM_LLM_BASE_URL:-}
      MASM_LLM_API_KEY: ${MASM_LLM_API_KEY:-}
      MASM_LLM_MODEL: gpt-4o-mini
      MASM_EMBEDDING_BASE_URL: ${MASM_EMBEDDING_BASE_URL:-}
      MASM_EMBEDDING_API_KEY: ${MASM_EMBEDDING_API_KEY:-}
      MASM_EMBEDDING_MODEL: text-embedding-v4
      MASM_EMBEDDING_DIMENSIONS: 1024
      MASM_MODEL_TIMEOUT_SECONDS: ${MASM_MODEL_TIMEOUT_SECONDS:-30}
      MASM_MODEL_MAX_ATTEMPTS: ${MASM_MODEL_MAX_ATTEMPTS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${MASM_V11_HTTP_PORT:-8002}:8000"
    volumes:
      - asset_data_v11:/data/assets
    networks:
      default:
      edge:
        aliases:
          - masm-v11-api
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data_v11:
    name: masm-v11-postgres-data
  asset_data_v11:
    name: masm-v11-asset-data

networks:
  default:
  edge:
    external: true
    name: masm-edge
