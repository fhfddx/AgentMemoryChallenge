# Alembic configuration. The database URL is read from the DATABASE_URL
# environment variable by alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder URL; DATABASE_URL environment variable takes precedence.
sqlalchemy.url = postgresql+psycopg://postgres@localhost:5433/masm_test

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
